name: Build APK

# Запускается при пуше в main и при создании pull request
# Triggered on push to main and on pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # Получаем исходный код
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем JDK 17
      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Даём права на выполнение gradlew
      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Сборка Debug APK
      # Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Восстанавливаем keystore из секрета GitHub (base64)
      # Restore keystore from GitHub Secret (base64 encoded)
      - name: Decode Keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      # Сборка Release APK (только при пуше в main)
      # Build Release APK (only on push to main)
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Публикуем Debug APK как артефакт
      # Upload Debug APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Публикуем Release APK как артефакт (только при пуше в main)
      # Upload Release APK as artifact (only on push to main)
      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Очищаем keystore из файловой системы после сборки
      # Clean up keystore file after build
      - name: Clean up keystore
        if: always()
        run: rm -f app/release-keystore.jks
