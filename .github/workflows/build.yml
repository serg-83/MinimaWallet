name: Build APK

# Запускается при пуше тега vX.X.X или в main, и при pull request
# Triggered on version tag push, push to main, and pull requests
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # Получаем исходный код
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем JDK 17
      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Даём права на выполнение gradlew
      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Сборка Debug APK
      # Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Восстанавливаем keystore из секрета GitHub (base64)
      # Restore keystore from GitHub Secret (base64 encoded)
      - name: Decode Keystore
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      # Сборка Release APK
      # Build Release APK
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Публикуем Debug APK как артефакт
      # Upload Debug APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Публикуем Release APK как артефакт
      # Upload Release APK as artifact
      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Создаём GitHub Release с APK при пуше тега
      # Create GitHub Release with APK on tag push
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MinimaWallet ${{ github.ref_name }}
          body: |
            ## MinimaWallet ${{ github.ref_name }}

            Нативный Android-кошелёк для сети Minima.
            Native Android wallet for the Minima blockchain network.

            ### Установка / Installation
            Скачайте `app-release.apk` и установите на Android устройство.
            Download `app-release.apk` and install on your Android device.

            > ⚠️ Разрешите установку из неизвестных источников в настройках Android.
            > ⚠️ Allow installation from unknown sources in Android settings.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false

      # Очищаем keystore из файловой системы после сборки
      # Clean up keystore file after build
      - name: Clean up keystore
        if: always()
        run: rm -f app/release-keystore.jks
